project:
  name: enterprise-rag
  environment: development

paths:
  raw_documents: Data
  evaluation_dataset: Evaluation/Dataset/evaluation_dataset.json

embedding:
  model_name: all-MiniLM-L6-v2

chunking:
  chunk_size: 800
  chunk_overlap: 70

retrieval:
  top_k: 10
  candidate_k: 5

bm25:
  enabled: true

hybrid_retrieval:
  enabled: true
  rrf_k: 60

generation:
  provider: gemini
  model_name: gemini-3.1-flash-lite
  temperature: 0.0
  max_output_tokens: 500

answerability:
  enabled: true